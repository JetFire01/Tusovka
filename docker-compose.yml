services:
  tusovka:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - tusovka-data:/app/data
    environment:
      - DATABASE_URL=file:./data/tusovka.db
      # Задайте JWT_SECRET в .env рядом с docker-compose.yml или в окружении —
      # без него контейнер намеренно не стартует.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a long random string}
    restart: unless-stopped

volumes:
  tusovka-data:
